<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i=1 ; i < 10 ; i++){
            console.log( "The Value is" , i)

        } 

        for(let  y=10; y>=1 ; y--){
            console.log("Reverse Order " , y)

        }

        let count = 1

        while(count<=5){
            console.log("Hello Guys")
            count++
        }

        let number = 7

        do{
            console.log("Hii I am Do While Loop")
        }while(number < 5)
    </script>
    
</body>
</html>
