<html lang="en">

<body>
    <script>

//1, Arithmatic Operator = + , - , / ,  *, %, 

    var a = 10
    var b = 7

    console.log(a-b)
    console.log(a+b)
    console.log(a*b)
    console.log(a/b)

    console.log(a%b)

    console.log(10%2)
    console.log(1%5)


    //2. Assignment - To Value  "="
     var x = 10

    //Assign and Oprations

    console.log(x = x + 5)

    console.log(x+=3.5)
    console.log(x-=2)

    //3.Comaprisons Operator
    var p = 25
    var q = 20

    console.log(p > q)
    console.log(p < q)

    var abc = 10
    var pqr = 10
    console.log(abc >= pqr)

    const height1 = "170"
    const height2 = 170

    // == only check the value not data type
    console.log(height1 == height2)
     // == check the value and  data type both

    console.log(height1 === height2)


    //Logical Operator - AND , OR , Negation

    //AND - && IF BOTH CONDITION IS TRUE THEN ONLY OUTPUT IS TRUE
     var isMember = true

     var TotalPrice = 499.99

     console.log( isMember && TotalPrice >= 500)

     //OR \\ : Only If One Condition is true then output is true 

     var JioHostarLogin = true 

     var PaidSub = false 

     console.log("Can Watch IPL As Free Access ", JioHostarLogin || PaidSub )

     //Negation - ! : Oppsite Value 
     let Netflixsubscription = false

     console.log("Amount Paid" , !Netflixsubscription)


    

    </script>
