<head>

    <title>Document</title>
    <style>
        #box{
            background-color: red;
            height: 100px;
            width: 100px;
        }

        #box:hover{
            transform: translateX(100px);
        }

        #box:hover{
            transform: rotate(2s);
        }

        #box:hover{
            transform: rotateY(360deg);
            transition: 2s;
        }

        #box:hover{
            transform: scale(1.2);
        }
    </style>
</head>
