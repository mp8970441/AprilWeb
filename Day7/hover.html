<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            color: blue;
            background-color: aqua;
            height: 150px;
            width: 150px;
            text-align: center;
        }
        div:hover{
            background-color: blueviolet;
            transition: 3s ease-in-out;
        }

       div p{
            color: red;
            list-style: none;
        }

        ul{
            color: brown;
            list-style: none;
        }
        ul li{
            display: inline;
        }
    </style>
</head>
<body>
    <div>
        <h2>Rasika</h2>
        <p>Full Stack Developer</p>
    </div>

    <ul>
        <li>Water</li>
        <li>Bag</li>
        <li>Snacks</li>
    </ul>

    <p>Profil Card</p>
    
</body>
</html>
