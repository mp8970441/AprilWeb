<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: sans-serif;
            text-align: center;
        }

        .piano{
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .key{
            border: 1px solid black;
            height: 200px;
            width: 60px;
            margin: 2px;
            background-color: white;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            cursor:pointer;
            transition: background-color 0.3s;
        }
        .key:active{
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <h1>Piano - Events</h1>

    <div class="piano">
       <div class="key" data-note="C">CAT</div>  
       <div class="key" data-note="D">D</div> 
       <div class="key"data-note="E">E</div>  
       <div class="key"data-note="F">F</div> 
       <div class="key"data-note="G">G</div>  
       <div class="key"data-note="A">A</div>  
       <div class="key"data-note="B">B</div>  
    
    </div>

    <audio id="audio-C" src="./absolutesound-1403-warm-guitar-in-the-rain-505772.mp3"></audio>
    <audio id="audio-D" src="./absolutesound-emotional-guitar-nostalgia-505780.mp3"></audio>
    <audio id="audio-E" src="./absolutesound-guitar-guitar-music-529764.mp3"></audio>
    <audio id="audio-F" src="./cryptosound-cryptosound-note-di-note-265794.mp3"></audio>
    <audio id="audio-A" src="./mondamusic-guitar-solo-guitar-music-499187 (1).mp3"></audio>
    <audio id="audio-B" src="./u_ma3glaeyj1-guitar-323963 (1).mp3"></audio>

   
    <script>
        const keys = document.querySelectorAll(".key")
        console.log(keys)

        //key will be an array because it is storing Multiple div container

        keys.forEach(function(e){

        const note = e.getAttribute("data-note")

        const audio = document.getElementById("audio-"+note)

            e.addEventListener('click', function(){
                audio.currentTime = 0;
                audio.play()

            })

        
            //Mouse

        e.addEventListener('mouseover', function(){
        e.style.backgroundColor ="lightblue"
        })

        e.addEventListener('mouseout', function(){
        e.style.backgroundColor ="white"
        })

    })
        
    </script>
 
     

    
</body>
</html>
